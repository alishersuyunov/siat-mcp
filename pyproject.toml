[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siat-mcp"
version = "0.3.1"
description = "MCP server for Uzbekistan official statistics — siat.stat.uz and nsdp.stat.uz"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.26.0,<2",
    "httpx>=0.27.0",
    "orjson>=3.9.0",
    "pysimdjson>=7.0.0",
    "cachetools>=5.3.0",
    "asyncache>=0.3.1",
]

[project.scripts]
siat-mcp = "server:main"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]

[project.urls]
Repository = "https://github.com/alishersuyunov/siat-mcp"
Issues = "https://github.com/alishersuyunov/siat-mcp/issues"

[tool.hatch.build.targets.sdist]
include = ["server.py", "pyproject.toml", "README.md", "LICENSE", "RELEASE_NOTES.md", "docs", "tests"]
